name: Build RedGuard Windows App

on:
  push:
    tags:
      - "app-v*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sentinelcore/app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: sentinelcore/app/src-tauri -> target

      - name: Install frontend deps
        run: npm install

      - name: Build Tauri app
        run: npm run tauri build

      - name: Rename installer
        shell: bash
        run: |
          cp src-tauri/target/release/bundle/nsis/*.exe RedGuard_Setup.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedGuard-Windows-Setup
          path: sentinelcore/app/RedGuard_Setup.exe
          retention-days: 30

  deploy:
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: RedGuard-Windows-Setup

      - name: Deploy installer to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 159.65.237.42
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: RedGuard_Setup.exe
          target: /opt/redguard/downloads/
