[package]
name = "sentinel-agent"
version = "0.1.0"
edition = "2021"
description = "SentinelCore endpoint agent — real-time malware detection"
authors = ["SentinelCore"]

[[bin]]
name = "sentinel-agent"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# File system monitoring
notify = "6"

# Process + system info
sysinfo = "0.30"

# HTTP client for API reporting
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Hashing
sha2 = "0.10"
md-5 = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
walkdir = "2"
hex = "0.4"
dashmap = "5"
once_cell = "1"
regex = "1"
crossbeam-channel = "0.5"
hostname = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
