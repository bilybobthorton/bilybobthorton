version: "3.9"

# Production compose — standalone (not an overlay).
# Usage: docker compose -f infra/docker-compose.prod.yml up -d

services:
  # ── Reverse proxy + TLS ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

  # ── Let's Encrypt auto-renewal ─────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/tmp/sentinel_uploads
      - ml_models:/app/sentinelcore/engine/ml
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Celery worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: celery -A api.tasks.celery_app worker --loglevel=info --concurrency=4 -Q default
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - upload_data:/tmp/sentinel_uploads
      - ml_models:/app/sentinelcore/engine/ml
    restart: unless-stopped

  # ── Next.js dashboard ──────────────────────────────────────────────────────
  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      - NODE_ENV=production
    depends_on:
      - api
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sentinelcore
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    # No exposed ports — only reachable inside Docker network

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # No exposed ports — only reachable inside Docker network

  # ── Alembic migrations (run-once init container) ───────────────────────────
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: alembic upgrade head
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pg_data:
  redis_data:
  upload_data:
  ml_models:
  certbot_certs:
  certbot_www:
